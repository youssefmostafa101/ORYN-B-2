name: Preview quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks
        env:
          BROWSER_CHANNEL: chromium
        run: |
          node tools/serve.mjs > /tmp/oryn-preview.log 2>&1 &
          node tools/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oryn-preview-review
          path: |
            dist/
            test-results/
